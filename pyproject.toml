[project]
name = "camopool"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "browserforge>=1.2,<2",
    "camoufox[geoip] @ git+https://github.com/daijro/camoufox.git@main#subdirectory=pythonlib",
    "fastapi>=0.115,<1",
    "playwright==1.61.0",
    "pydantic>=2.9,<3",
    "uvicorn[standard]>=0.30,<1",
    "websockets>=16,<17",
]

[project.scripts]
camopool = "camopool.api:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["camopool"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
override-dependencies = ["playwright==1.61.0"]
